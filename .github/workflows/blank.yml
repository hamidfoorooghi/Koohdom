
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZIP archives
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' archive; do
            echo "Extracting: $archive"

            destination="${archive%.*}_extracted"
            mkdir -p "$destination"

            unzip -oq "$archive" -d "$destination"
          done < <(
            find . -type f -iname "*.zip" \
              -not -path "./.git/*" \
              -print0
          )

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            candidate=$(dirname "$file")

            if [ -f "$candidate/gradlew" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path "*/build/*" \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r -d '' file; do
              candidate=$(dirname "$file")

              if [ -f "$candidate/gradlew" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(
              find . -type f \
                \( -name build.gradle \
                -o -name build.gradle.kts \) \
                -not -path "*/build/*" \
                -print0
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project with gradlew not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "${{ steps.locate.outputs.project_dir }}" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -iname "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/apk-output")" ]; then
            echo "ERROR: No APK file generated."
            exit 1
          fi

          echo "Generated APK files:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
