
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "**"
      - "!README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project archives
        run: |
          set -e
          find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' archive; do
            echo "Extracting: $archive"
            destination="${archive%.*}_extracted"
            mkdir -p "$destination"
            unzip -oq "$archive" -d "$destination"
          done

      - name: Locate Android project
        id: locate
        run: |
          set -e

          GRADLE_FILE=$(find . -type f \
            -name settings.gradle -o \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -type f \
              \( -name build.gradle -o \
                 -name build.gradle.kts \) \
              -not -path "*/build/*" | head -n 1)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "No Gradle Android project found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          while [ "$PROJECT_DIR" != "." ] &&
                [ ! -f "$PROJECT_DIR/gradlew" ]; do
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK files
        id: apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "${{ steps.locate.outputs.project_dir }}" \
            -type f -iname "*.apk" \
            -path "*/build/outputs/apk/*" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/apk-output")" ]; then
            echo "No APK generated."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
