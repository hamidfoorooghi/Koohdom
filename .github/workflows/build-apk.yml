
name: Build Koohdom APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HefazatKouhDam_REVIEWED.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Extract project
        run: unzip -q HefazatKouhDam_REVIEWED.zip -d project

      - name: Build APK
        working-directory: project/hefazat-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Koohdom-APK
          path: project/hefazat-app/app/build/outputs/apk/debug/app-debug.apk
