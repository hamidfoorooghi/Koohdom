
name: Build Koohdom APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HefazatKouhDam_REVIEWED.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Extract project
        run: |
          unzip -q HefazatKouhDam_REVIEWED.zip -d project
          cd project/hefazat-app
          chmod +x gradlew

      - name: Build APK
        working-directory: project/hefazat-app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Koohdom-APK
          path: project/hefazat-app/app/build/outputs/apk/debug/app-debug.apk
